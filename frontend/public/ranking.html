<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking Servidores CS 1.6 — Top Servidores Counter-Strike Brasil | CS Booster BR</title>
  <meta name="description" content="Ranking dos melhores servidores Counter-Strike 1.6 do Brasil. Top servidores por votos, jogadores e ping. Zombie Plague, JailBreak, Surf. Vote e suba no ranking!">
  <meta name="keywords" content="ranking servidores cs 1.6, top servidores counter-strike, melhores servidores cs brasil, top zombie plague server, server ranking cs 1.6, votar servidor cs, top 100 servidores cs">
  <link rel="canonical" href="https://erenzp-booster.netlify.app/ranking.html">
  <meta property="og:title" content="Ranking Top Servidores CS 1.6 — CS Booster BR">
  <meta property="og:description" content="Top servidores CS 1.6 por votos, jogadores e ping. Vote no seu favorito e suba no ranking!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://erenzp-booster.netlify.app/ranking.html">
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-logo"><span class="logo-icon">🎮</span>CS Booster BR</a>
    <ul class="navbar-nav">
      <li><a href="/">Início</a></li><li><a href="servers.html">Servidores</a></li>
      <li><a href="ranking.html" class="active">Ranking</a></li>
    </ul>
    <div class="navbar-actions">
      <button class="btn-theme" id="themeToggle">☀️</button>
      <div id="navActions"></div>
    </div>
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="container">
  <section class="section">
    <div class="section-header">
      <h1 class="section-title">🏆 Ranking de Servidores CS 1.6</h1>
    </div>

    <div class="tabs" id="rankTabs">
      <button class="tab-btn active" data-type="votes">Mais Votados</button>
      <button class="tab-btn" data-type="players">Mais Jogadores</button>
      <button class="tab-btn" data-type="ping">Melhor Ping</button>
      <button class="tab-btn" data-type="popular">Mais Vistos</button>
      <button class="tab-btn" data-type="newest">Novos</button>
      <button class="tab-btn" data-type="featured">Destaque</button>
    </div>

    <div class="filter-bar" style="margin-top:0">
      <select id="fCountry"><option value="">Todos os Países</option></select>
      <select id="fMod"><option value="">Todos os Mods</option>
        <option>Classic</option><option>Deathmatch</option><option>JailBreak</option>
        <option>Zombie</option><option>Surf</option><option>Bhop</option>
        <option>BaseBuilder</option><option>Other</option>
      </select>
      <span id="rankCount" style="color:var(--text-muted);font-size:.85rem;margin-left:auto"></span>
    </div>

    <div class="table-wrapper">
      <table>
        <thead><tr><th>#</th><th>Servidor</th><th>Mod</th><th>País</th><th>Jogadores</th><th>Votos</th><th>Ping</th><th>Status</th><th></th></tr></thead>
        <tbody id="rankTable"><tr><td colspan="9" class="loading-overlay"><div class="spinner"></div></td></tr></tbody>
      </table>
    </div>
    <div style="display:flex;justify-content:center;gap:.5rem;margin-top:1.5rem;flex-wrap:wrap" id="rankPagination"></div>
  </section>
</div>

<script src="js/app.js"></script>
<script>
const API = 'https://cs16-server-booster-production.up.railway.app/api';
let currentType = 'votes', currentPage = 1;

async function loadRanking() {
  const country = document.getElementById('fCountry').value;
  const mod = document.getElementById('fMod').value;
  const params = new URLSearchParams({ type: currentType, page: currentPage });
  if (country) params.set('country', country);
  if (mod) params.set('mod', mod);
  const tbody = document.getElementById('rankTable');
  tbody.innerHTML = '<tr><td colspan="9" class="loading-overlay"><div class="spinner"></div></td></tr>';
  try {
    const data = await fetch(`${API}/servers/meta/ranking?${params}`).then(r=>r.json());
    document.getElementById('rankCount').textContent = `${data.total} servers`;
    tbody.innerHTML = data.servers?.length ? data.servers.map(s => {
      const rank = s.rank || ((currentPage-1)*50 + data.servers.indexOf(s) + 1);
      const online = s.status === 'online';
      return `<tr>
        <td><span class="rank-number rank-${rank}">${rank <= 3 ? ['🥇','🥈','🥉'][rank-1] : '#'+rank}</span></td>
        <td>
          <a href="server.html?s=${s.slug}" style="font-weight:700;color:var(--text-primary)">${escHtml(s.name)}</a>
          ${s.is_featured?'<span class="badge badge-featured" style="margin-left:.3rem">⭐</span>':''}
          ${s.is_verified?'<span class="badge badge-verified" style="margin-left:.3rem">✔</span>':''}
          <br><small style="font-family:monospace;color:var(--text-muted)">${s.ip}:${s.port}</small>
        </td>
        <td><span class="badge badge-mod">${escHtml(s.mod)}</span></td>
        <td>${countryFlag(s.country)} ${escHtml(s.country||'—')}</td>
        <td>👥 ${s.current_players}/${s.max_players}</td>
        <td style="color:var(--accent-gold);font-weight:700">📊 ${s.vote_count}</td>
        <td style="color:${s.ping&&s.ping<100?'var(--accent-green)':s.ping>200?'var(--offline)':'var(--text-primary)'}">${s.ping||'—'}ms</td>
        <td><span class="badge ${online?'badge-online':'badge-offline'}">${online?'🟢 Online':'🔴 Offline'}</span></td>
        <td><a href="server.html?s=${s.slug}" class="btn btn-primary btn-sm">Ver</a></td>
      </tr>`;
    }).join('') : '<tr><td colspan="9" style="text-align:center;padding:3rem;color:var(--text-muted)">Nenhum servidor encontrado</td></tr>';
    buildPagination(data.total, 50, currentPage);
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:2rem;color:var(--offline)">API indisponível. Aguarde um momento.</td></tr>';
  }
}

function buildPagination(total, limit, page) {
  const totalPages = Math.ceil(total/limit);
  const el = document.getElementById('rankPagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  let html = '';
  if (page > 1) html += `<button class="btn btn-secondary btn-sm" onclick="goPage(${page-1})">← Anterior</button>`;
  for (let i=Math.max(1,page-1); i<=Math.min(totalPages,page+2); i++) html += `<button class="btn ${i===page?'btn-primary':'btn-secondary'} btn-sm" onclick="goPage(${i})">${i}</button>`;
  if (page < totalPages) html += `<button class="btn btn-secondary btn-sm" onclick="goPage(${page+1})">Próxima →</button>`;
  el.innerHTML = html;
}

function goPage(p) { currentPage = p; loadRanking(); window.scrollTo(0,0); }

// Tabs
document.querySelectorAll('#rankTabs .tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#rankTabs .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    currentPage = 1;
    loadRanking();
  });
});

['fCountry','fMod'].forEach(id => document.getElementById(id)?.addEventListener('change', () => { currentPage=1; loadRanking(); }));

// Load country filter
fetch(`${API}/stats/global`).then(r=>r.json()).then(d => {
  const sel = document.getElementById('fCountry');
  (d.countries||[]).forEach(c => { if(c.country) sel.innerHTML += `<option value="${escHtml(c.country)}">${countryFlag(c.country)} ${c.country}</option>`; });
});

loadRanking();
</script>
</body>
</html>
