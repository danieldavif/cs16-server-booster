<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — CS Booster</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-logo"><span class="logo-icon">⚡</span>Admin Panel</a>
    <ul class="navbar-nav">
      <li><a href="/">← Site</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
    <div class="navbar-actions">
      <button class="btn-theme" id="themeToggle">☀️</button>
      <div id="navActions"></div>
    </div>
  </div>
</nav>

<div class="container">
  <section class="section">
    <div id="adminContent"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </section>
</div>

<script src="js/app.js"></script>
<script>
const API = 'http://localhost:3000/api';

async function checkAdmin() {
  if (!auth.isLoggedIn() || auth.user?.role !== 'admin') {
    document.getElementById('adminContent').innerHTML = '<div class="empty-state"><div class="icon">🚫</div><h3>Admin access required</h3></div>';
    return;
  }
  loadAdminStats();
}

async function loadAdminStats() {
  try {
    const stats = await api.get('/admin/stats');
    document.getElementById('adminContent').innerHTML = `
      <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:1.5rem">⚡ Admin Panel</h1>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:2rem">
        <div class="stat-card"><div class="stat-icon blue">👤</div><div><div class="stat-value">${stats.users}</div><div class="stat-label">Users</div></div></div>
        <div class="stat-card"><div class="stat-icon red">🖥️</div><div><div class="stat-value">${stats.servers}</div><div class="stat-label">Servers</div></div></div>
        <div class="stat-card"><div class="stat-icon green">🟢</div><div><div class="stat-value">${stats.onlineServers}</div><div class="stat-label">Online</div></div></div>
        <div class="stat-card"><div class="stat-icon gold">👥</div><div><div class="stat-value">${stats.onlinePlayers}</div><div class="stat-label">Players</div></div></div>
        <div class="stat-card"><div class="stat-icon red">🚨</div><div><div class="stat-value" style="color:${stats.pendingReports>0?'var(--offline)':'inherit'}">${stats.pendingReports}</div><div class="stat-label">Reports</div></div></div>
      </div>

      <!-- Tabs -->
      <div class="tabs" id="adminTabs">
        <button class="tab-btn active" onclick="loadAdminTab('servers')">Servers</button>
        <button class="tab-btn" onclick="loadAdminTab('users')">Users</button>
        <button class="tab-btn" onclick="loadAdminTab('reports')">Reports ${stats.pendingReports>0?'🔴':''}</button>
        <button class="tab-btn" onclick="loadAdminTab('logs')">Logs</button>
      </div>
      <div id="adminTabContent"><div class="loading-overlay"><div class="spinner"></div></div></div>`;

    loadAdminTab('servers');
  } catch(e) {
    document.getElementById('adminContent').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><h3>API Error</h3></div>';
  }
}

async function loadAdminTab(tab) {
  document.querySelectorAll('#adminTabs .tab-btn').forEach((b,i) => b.classList.toggle('active', ['servers','users','reports','logs'][i]===tab));
  const el = document.getElementById('adminTabContent');
  el.innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';
  try {
    if (tab === 'servers') {
      const data = await api.get('/admin/servers?limit=30');
      el.innerHTML = `<div class="table-wrapper"><table>
        <thead><tr><th>Server</th><th>Owner</th><th>Status</th><th>Verified</th><th>Actions</th></tr></thead>
        <tbody>${(data.servers||[]).map(s=>`<tr>
          <td><a href="server.html?s=${s.slug}" target="_blank" style="font-weight:600">${escHtml(s.name)}</a><br><small style="font-family:monospace;color:var(--text-muted)">${s.ip}:${s.port}</small></td>
          <td>${escHtml(s.owner_username||'—')}</td>
          <td><span class="badge ${s.status==='online'?'badge-online':'badge-offline'}">${s.status}</span></td>
          <td>${s.is_verified?'✅':'⏳'}</td>
          <td style="display:flex;gap:.4rem;flex-wrap:wrap">
            ${!s.is_verified?`<button class="btn btn-success btn-sm" onclick="adminAction('/admin/servers/${s.id}/approve','PUT',{})">✅ Verify</button>`:''}
            ${s.is_active?`<button class="btn btn-danger btn-sm" onclick="adminAction('/admin/servers/${s.id}/block','PUT',{})">🚫 Block</button>`:`<button class="btn btn-success btn-sm" onclick="adminAction('/admin/servers/${s.id}/approve','PUT',{})">✅ Restore</button>`}
            <button class="btn btn-gold btn-sm" onclick="adminFeature('${s.id}')">⭐ Feature</button>
          </td>
        </tr>`).join('')}
        </tbody></table></div>`;
    } else if (tab === 'users') {
      const data = await api.get('/admin/users');
      el.innerHTML = `<div class="table-wrapper"><table>
        <thead><tr><th>User</th><th>Role</th><th>Points</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${(data.users||[]).map(u=>`<tr>
          <td><strong>${escHtml(u.username)}</strong><br><small style="color:var(--text-muted)">${escHtml(u.email)}</small></td>
          <td><span class="badge ${u.role==='admin'?'badge-verified':'badge-mod'}">${u.role}</span></td>
          <td style="color:var(--accent-gold)">⚡ ${u.boost_points}</td>
          <td>${u.is_banned?'<span class="badge badge-offline">Banned</span>':'<span class="badge badge-online">Active</span>'}</td>
          <td style="display:flex;gap:.4rem;flex-wrap:wrap">
            ${u.is_banned?`<button class="btn btn-success btn-sm" onclick="adminAction('/admin/users/${u.id}/unban','PUT',{})">✅ Unban</button>`:`<button class="btn btn-danger btn-sm" onclick="banUser('${u.id}')">🚫 Ban</button>`}
          </td>
        </tr>`).join('')}
        </tbody></table></div>`;
    } else if (tab === 'reports') {
      const rows = await api.get('/admin/reports');
      el.innerHTML = `<div class="table-wrapper"><table>
        <thead><tr><th>Server</th><th>Reporter</th><th>Reason</th><th>Date</th><th></th></tr></thead>
        <tbody>${(rows||[]).map(r=>`<tr>
          <td><a href="server.html?s=${r.server_id}" target="_blank">${escHtml(r.server_name||r.server_id)}</a></td>
          <td>${escHtml(r.reporter_name||r.reporter_ip||'—')}</td>
          <td>${escHtml(r.reason)}: ${escHtml(r.description||'')}</td>
          <td style="color:var(--text-muted);font-size:.82rem">${timeAgo(r.created_at)}</td>
          <td><button class="btn btn-success btn-sm" onclick="adminAction('/admin/reports/${r.id}/resolve','PUT',{})">✅ Resolve</button></td>
        </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text-muted)">No pending reports</td></tr>'}
        </tbody></table></div>`;
    } else if (tab === 'logs') {
      const rows = await api.get('/admin/logs');
      el.innerHTML = `<div class="table-wrapper"><table>
        <thead><tr><th>Action</th><th>User</th><th>IP</th><th>Date</th></tr></thead>
        <tbody>${(rows||[]).map(r=>`<tr>
          <td>${escHtml(r.action)}</td>
          <td>${escHtml(r.user_id||'—')}</td>
          <td style="font-family:monospace;font-size:.8rem">${escHtml(r.ip_address||'—')}</td>
          <td style="color:var(--text-muted);font-size:.82rem">${timeAgo(r.created_at)}</td>
        </tr>`).join('')}
        </tbody></table></div>`;
    }
  } catch(e) { el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Error: ${e.message}</h3></div>`; }
}

async function adminAction(path, method, body) {
  try {
    await api.request(method, path, body);
    toast('Done!','success');
    loadAdminStats();
  } catch(e) { toast(e.message,'error'); }
}

async function banUser(id) {
  const reason = prompt('Ban reason:'); if (!reason) return;
  await adminAction(`/admin/users/${id}/ban`,'PUT',{reason});
}

async function adminFeature(id) {
  const h = prompt('Feature for how many hours? (e.g. 24, 72, 168)','24'); if (!h) return;
  await adminAction(`/admin/servers/${id}/feature`,'PUT',{hours:parseInt(h)});
}

checkAdmin();
</script>
</body>
</html>
