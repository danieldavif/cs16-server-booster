<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse CS 1.6 Servers — CS Booster</title>
  <meta name="description" content="Browse all CS 1.6 servers. Filter by mod, country, players and more.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-logo"><span class="logo-icon">🎮</span>CS Booster</a>
    <ul class="navbar-nav">
      <li><a href="/">Home</a></li>
      <li><a href="servers.html" class="active">Servers</a></li>
      <li><a href="ranking.html">Ranking</a></li>
      <li><a href="earn-points.html">Earn Points</a></li>
      <li><a href="faq.html">FAQ</a></li>
    </ul>
    <div class="navbar-actions">
      <button class="btn-theme" id="themeToggle">☀️</button>
      <a href="add-server.html" class="btn btn-primary btn-sm">+ Add Server</a>
      <div id="navActions"></div>
    </div>
    <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="container">
  <section class="section">
    <div class="section-header">
      <h1 class="section-title">📋 Server List</h1>
      <span id="totalCount" style="color:var(--text-muted);font-size:.9rem"></span>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="🔍 Search by name, IP, tags..." style="min-width:220px" value="">
      <select id="filterMod">
        <option value="">All Mods</option>
        <option>Classic</option><option>Deathmatch</option><option>JailBreak</option>
        <option>Zombie</option><option>Surf</option><option>Bhop</option>
        <option>Minigames</option><option>KnifeFight</option><option>GunGame</option>
        <option>BaseBuilder</option><option>Deathrun</option><option>Other</option>
      </select>
      <select id="filterStatus">
        <option value="">All Status</option>
        <option value="online">Online</option>
        <option value="offline">Offline</option>
      </select>
      <select id="filterSort">
        <option value="votes">Most Voted</option>
        <option value="players">Most Players</option>
        <option value="ping">Best Ping</option>
        <option value="newest">Newest</option>
        <option value="featured">Featured</option>
        <option value="views">Most Viewed</option>
      </select>
      <select id="filterCountry">
        <option value="">All Countries</option>
      </select>
      <button class="btn btn-secondary btn-sm" onclick="resetFilters()">✕ Reset</button>
    </div>

    <div class="server-grid" id="serverGrid">
      <div class="loading-overlay"><div class="spinner"></div></div>
    </div>

    <!-- Pagination -->
    <div style="display:flex;justify-content:center;gap:.5rem;margin-top:2rem;flex-wrap:wrap" id="pagination"></div>
  </section>
</div>

<script src="js/app.js"></script>
<script>
const API = 'https://cs16-server-booster-production.up.railway.app/api';
let currentPage = 1;

function getFilters() {
  return {
    q: document.getElementById('searchInput').value.trim(),
    mod: document.getElementById('filterMod').value,
    status: document.getElementById('filterStatus').value,
    sort: document.getElementById('filterSort').value,
    country: document.getElementById('filterCountry').value,
    page: currentPage,
    limit: 18,
  };
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('filterMod').value = '';
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterSort').value = 'votes';
  document.getElementById('filterCountry').value = '';
  currentPage = 1; loadServers();
}

async function loadServers() {
  const f = getFilters();
  const params = new URLSearchParams(Object.fromEntries(Object.entries(f).filter(([,v])=>v!=='')));
  const grid = document.getElementById('serverGrid');
  grid.innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';
  try {
    const data = await fetch(`${API}/servers?${params}`).then(r=>r.json());
    document.getElementById('totalCount').textContent = `${data.total} servers found`;
    grid.innerHTML = data.servers?.length
      ? data.servers.map((s,i) => buildServerCard(s, f.sort==='votes'?((f.page-1)*f.limit+i+1):null)).join('')
      : '<div class="empty-state" style="grid-column:1/-1"><div class="icon">🔍</div><h3>No servers found</h3><p>Try different filters</p></div>';
    buildPagination(data.total, f.limit, f.page);
  } catch(e) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">⚠️</div><h3>Cannot reach API</h3><p>Start the backend server</p></div>';
  }
}

function buildPagination(total, limit, page) {
  const totalPages = Math.ceil(total / limit);
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  let html = '';
  if (page > 1) html += `<button class="btn btn-secondary btn-sm" onclick="goPage(${page-1})">← Prev</button>`;
  const start = Math.max(1, page-2), end = Math.min(totalPages, page+2);
  for (let i=start; i<=end; i++) html += `<button class="btn ${i===page?'btn-primary':'btn-secondary'} btn-sm" onclick="goPage(${i})">${i}</button>`;
  if (page < totalPages) html += `<button class="btn btn-secondary btn-sm" onclick="goPage(${page+1})">Next →</button>`;
  el.innerHTML = html;
}

function goPage(p) { currentPage = p; loadServers(); window.scrollTo(0,0); }

// Apply URL params
const urlp = new URLSearchParams(location.search);
if (urlp.get('q')) document.getElementById('searchInput').value = urlp.get('q');
if (urlp.get('mod')) document.getElementById('filterMod').value = urlp.get('mod');
if (urlp.get('status')) document.getElementById('filterStatus').value = urlp.get('status');
if (urlp.get('sort')) document.getElementById('filterSort').value = urlp.get('sort');

// Load countries
fetch(`${API}/stats/global`).then(r=>r.json()).then(d=>{
  const sel = document.getElementById('filterCountry');
  (d.countries||[]).forEach(c => { if(c.country) sel.innerHTML += `<option value="${escHtml(c.country)}">${c.country} (${c.c})</option>`; });
});

// Live search debounce
let debounce;
document.getElementById('searchInput').addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(() => { currentPage=1; loadServers(); }, 400); });
['filterMod','filterStatus','filterSort','filterCountry'].forEach(id => document.getElementById(id).addEventListener('change', () => { currentPage=1; loadServers(); }));

loadServers();
</script>
</body>
</html>
