<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ — CS Booster BR</title>
  <meta name="description" content="Perguntas frequentes sobre o CS Booster BR — plataforma gratuita de servidores de Counter-Strike 1.6.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-logo"><span class="logo-icon">🎮</span>CS Booster BR</a>
    <ul class="navbar-nav">
      <li><a href="/">Início</a></li>
      <li><a href="servers.html">Servidores</a></li>
      <li><a href="ranking.html">Ranking</a></li>
      <li><a href="faq.html" class="active">FAQ</a></li>
    </ul>
    <div class="navbar-actions"><button class="btn-theme" id="themeToggle">☀️</button><div id="navActions"></div></div>
  </div>
</nav>

<div class="container" style="max-width:760px">
  <section class="section">
    <h1 class="section-title" style="margin-bottom:2rem">❓ Perguntas Frequentes</h1>
    <div id="faqList"></div>
  </section>
</div>

<script src="js/app.js"></script>
<script>
const FAQS = [
  {
    q: 'O que é o CS Booster BR?',
    a: 'Uma plataforma gratuita para listar, descobrir e dar boost em servidores de Counter-Strike 1.6. Donos de servidor podem cadastrar seu servidor e ganhar visibilidade por meio de votos, boosts e rankings.'
  },
  {
    q: 'Quanto custa usar o site?',
    a: 'O CS Booster BR é 100% gratuito. O sistema de boost usa nossa moeda virtual "Boost Points", que você ganha de graça através de atividades no site — sem precisar pagar nada.'
  },
  {
    q: 'Como funcionam os Boost Points?',
    a: 'Você ganha Boost Points fazendo login diário, votando em servidores, cadastrando um servidor e convidando amigos. Os pontos podem ser gastos para destacar seu servidor no topo do ranking e ganhar mais visibilidade.'
  },
  {
    q: 'Como funciona o ranking?',
    a: 'Os servidores são ranqueados por votos, players online, ping ou visualizações. Servidores em destaque aparecem no topo. Os votos são resetados mensalmente para manter o ranking justo.'
  },
  {
    q: 'O site gera jogadores falsos (bots)?',
    a: 'Não! Proibimos estritamente jogadores falsos, bots ou tráfego artificial. O sistema de boost aumenta apenas a visibilidade dentro do nosso site — não afeta o número de jogadores nos servidores de jogo.'
  },
  {
    q: 'Com que frequência o status do servidor é atualizado?',
    a: 'O status é consultado via protocolo UDP A2S_INFO do CS 1.6 a cada 5 minutos automaticamente. Você também pode forçar uma atualização manualmente no painel.'
  },
  {
    q: 'Posso cadastrar vários servidores?',
    a: 'Sim! Você pode cadastrar até 10 servidores por conta. Cada servidor cadastrado rende +20 Boost Points.'
  },
  {
    q: 'O que é o Boost Grátis Diário?',
    a: 'Uma vez por dia, por servidor, você pode ativar um boost gratuito que dá visibilidade extra por 24 horas e alguns Boost Points de bônus — sem gastar nenhum ponto!'
  },
  {
    q: 'Como me conecto a um servidor?',
    a: 'Clique no botão "Conectar" na página do servidor. Ele abre o Steam e conecta diretamente. Você também pode copiar o IP e colar no console do CS 1.6 com o comando "connect IP:PORTA".'
  },
  {
    q: 'O site funciona no celular?',
    a: 'Sim! O site é totalmente responsivo e funciona em qualquer dispositivo — celular, tablet ou computador.'
  },
  {
    q: 'Como ganho mais Boost Points?',
    a: 'Login diário (+10 a +30 pts por streak), votar em servidores (+2 pts), cadastrar servidor (+20 pts), convidar amigos (+15 pts por amigo). Acesse "Ganhar Pontos" no menu para ver todas as formas!'
  },
  {
    q: 'Por que meu servidor aparece como offline?',
    a: 'O servidor pode estar temporariamente inacessível, com firewall bloqueando a porta UDP, ou com o IP/porta incorretos. Verifique se a porta UDP está liberada e se o servidor está rodando.'
  },
];

document.getElementById('faqList').innerHTML = FAQS.map((f, i) => `
  <div class="card" style="margin-bottom:.75rem">
    <button onclick="toggleFaq(${i})" style="width:100%;background:none;border:none;display:flex;align-items:center;justify-content:space-between;text-align:left;color:var(--text-primary);font-weight:700;font-size:.98rem;cursor:pointer;padding:0;gap:1rem">
      <span>${f.q}</span>
      <span id="faqArrow${i}" style="color:var(--accent-red);font-size:1.3rem;flex-shrink:0">+</span>
    </button>
    <div id="faqAns${i}" style="display:none;margin-top:.75rem;color:var(--text-secondary);font-size:.9rem;line-height:1.75;border-top:1px solid var(--border);padding-top:.75rem">${f.a}</div>
  </div>`).join('');

function toggleFaq(i) {
  const el = document.getElementById('faqAns' + i);
  const arrow = document.getElementById('faqArrow' + i);
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  arrow.textContent = open ? '+' : '−';
}
</script>
</body>
</html>
