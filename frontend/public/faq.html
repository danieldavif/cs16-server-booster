<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ — CS Booster</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-logo"><span class="logo-icon">🎮</span>CS Booster</a>
    <ul class="navbar-nav">
      <li><a href="/">Home</a></li><li><a href="servers.html">Servers</a></li>
      <li><a href="ranking.html">Ranking</a></li><li><a href="faq.html" class="active">FAQ</a></li>
    </ul>
    <div class="navbar-actions"><button class="btn-theme" id="themeToggle">☀️</button><div id="navActions"></div></div>
  </div>
</nav>
<div class="container" style="max-width:760px">
  <section class="section">
    <h1 class="section-title" style="margin-bottom:2rem">❓ Frequently Asked Questions</h1>
    <div id="faqList"></div>
  </section>
</div>
<script src="js/app.js"></script>
<script>
const FAQS = [
  { q: 'What is CS 1.6 Server Booster?', a: 'A free platform to list, discover and boost Counter-Strike 1.6 servers. Server owners can register their server and gain visibility through votes, boosts and rankings.' },
  { q: 'How much does it cost?', a: 'CS Booster is 100% free. The boost system uses our virtual currency "Boost Points" which you earn for free through activity on the site.' },
  { q: 'How do Boost Points work?', a: 'You earn Boost Points by logging in daily, voting for servers, registering a server, and inviting friends. Points can be spent to feature your server in the top section.' },
  { q: 'How does the ranking work?', a: 'Servers are ranked by votes, players, ping, or views. Featured servers appear at the top. Votes reset monthly to keep rankings fair.' },
  { q: 'Does this generate fake players?', a: 'No. We strictly prohibit fake players, bots or artificial traffic. The boost system only increases visibility inside our website, not in the actual game servers.' },
  { q: 'How often is server status updated?', a: 'Server status is queried via the CS 1.6 A2S_INFO UDP protocol every 5 minutes by default.' },
  { q: 'Can I add multiple servers?', a: 'Yes, up to 10 servers per account.' },
  { q: 'What is the free daily boost?', a: 'Once per day per server, you can activate a free boost that gives your server extra visibility for 24 hours and some bonus Boost Points, at no cost.' },
  { q: 'How do I connect to a server?', a: 'Click the "Connect" button on any server page. It opens Steam and connects directly. You can also copy the IP and paste it into CS 1.6\'s console with "connect IP:PORT".' },
  { q: 'Can I use this on mobile?', a: 'Yes! The site is fully responsive and works on all devices.' },
];
document.getElementById('faqList').innerHTML = FAQS.map((f,i) => `
  <div class="card" style="margin-bottom:.75rem">
    <button onclick="toggleFaq(${i})" style="width:100%;background:none;border:none;display:flex;align-items:center;justify-content:space-between;text-align:left;color:var(--text-primary);font-weight:700;font-size:.98rem;cursor:pointer;padding:0">
      <span>${f.q}</span><span id="faqArrow${i}" style="color:var(--accent-red);font-size:1.2rem">+</span>
    </button>
    <div id="faqAns${i}" style="display:none;margin-top:.75rem;color:var(--text-secondary);font-size:.9rem;line-height:1.7">${f.a}</div>
  </div>`).join('');
function toggleFaq(i) {
  const el = document.getElementById('faqAns'+i);
  const arrow = document.getElementById('faqArrow'+i);
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  arrow.textContent = open ? '+' : '−';
}
</script>
</body>
</html>
